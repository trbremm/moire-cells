<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Moiré Cells</title>
<link rel="icon" href="data:,">
<style>
:root {
  --bg: #04060a;
  --ink: #d9dde6;
  --dim: #7f8798;
  --line: rgba(217, 221, 230, 0.18);
  --panel: rgba(6, 9, 15, 0.62);
  --epi: #79dcd8;
  --thr: #ff7062;
  --mono: 'IBM Plex Mono', ui-monospace, 'Cascadia Mono', Consolas, monospace;
  color-scheme: dark;
  background: var(--bg);
}
html, body { height: 100%; margin: 0; }
body {
  position: relative; overflow: hidden;
  background: var(--bg); color: var(--ink);
  font-family: var(--mono); font-size: 12px; line-height: 1.5;
}
/* one finger on the dish is the active tool's; two fingers pinch-zoom the page (the browser's) */
/* app: one finger on the dish is the active tool's; two fingers pinch-zoom and pan the VIEW (src/main.js), not the page */
canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; cursor: crosshair; }

/* frame-time / adapter readout, toggled with F */
#overlay {
  position: absolute; top: 14px; left: max(16px, env(safe-area-inset-left, 0px));
  margin: 0; padding: 8px 10px; max-width: calc(100% - 32px);
  background: var(--panel); border: 1px solid var(--line); border-radius: 4px;
  color: var(--dim); white-space: pre-wrap; pointer-events: none;
  font-variant-numeric: tabular-nums;
}
#overlay b { color: var(--epi); font-weight: 500; }
#overlay[hidden] { display: none; }

/* step C1: the entropy counter, top right (Shift+E); the F overlay keeps clear of it */
#entropy {
  position: absolute; top: 14px; right: max(16px, env(safe-area-inset-right, 0px));
  margin: 0; padding: 8px 10px; max-width: calc(100% - 32px); box-sizing: border-box;
  background: var(--panel); border: 1px solid var(--line); border-radius: 4px;
  color: var(--dim); white-space: pre-wrap; pointer-events: none;
  font-variant-numeric: tabular-nums;
}
#entropy::first-line { color: var(--ink); letter-spacing: 0.04em; }
#entropy[hidden] { display: none; }
body.entropy-on #overlay { top: 116px; }

/* the flash / hint line: just above the controls (src/ui.js keeps --ui-h at their height) */
#hint {
  position: absolute; left: max(16px, env(safe-area-inset-left, 0px)); right: max(16px, env(safe-area-inset-right, 0px));
  bottom: calc(max(14px, env(safe-area-inset-bottom, 0px)) + var(--ui-h, 0px) + 8px);
  margin: 0; color: var(--dim); opacity: 0.75; pointer-events: none; text-align: left;
}
/* wide screens: bottom right, beside the bar, as before the toolbar */
@media (min-width: 900px) {
  #hint {
    left: auto; bottom: max(14px, env(safe-area-inset-bottom, 0px)); text-align: right;
    max-width: calc(100% - var(--bar-w, 0px) - 72px);
  }
}

/* step C3b: the toolbar and its panels (src/ui.js). Thin outlines, flat, hard edges; no glow, no shadow */
.ui {
  --line2: rgba(217, 221, 230, 0.36);
  --s: 34px;
  position: absolute; left: max(16px, env(safe-area-inset-left, 0px)); bottom: max(14px, env(safe-area-inset-bottom, 0px));
  display: flex; flex-direction: column; align-items: flex-start; gap: 8px;
  max-width: calc(100% - 32px); pointer-events: none;
  -webkit-user-select: none; user-select: none; -webkit-touch-callout: none;
}
.ui > * { pointer-events: auto; }
.bar { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.grp { display: flex; gap: 2px; }
.ui button { font: inherit; color: var(--ink); touch-action: manipulation; cursor: pointer; }
.btn {
  width: var(--s); height: var(--s); padding: 0; display: grid; place-items: center;
  background: var(--panel); border: 1px solid var(--line); border-radius: 3px;
}
.ui svg { width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 1.25; stroke-linecap: square; stroke-linejoin: miter; }
.btn:hover, .ui .seg button:hover, .ui .kb:hover, .ui .act:hover, .ui .cyc:hover .val { border-color: var(--line2); }
.btn[aria-pressed="true"] { border-color: var(--epi); color: var(--epi); }
.ui button:focus-visible, .ui input:focus-visible { outline: 1px solid var(--epi); outline-offset: 1px; }
.btn.speed {
  width: auto; min-width: calc(var(--s) + 8px); padding: 0 5px;
  display: flex; flex-direction: column; align-items: center; justify-content: center; line-height: 1.05;
  font-variant-numeric: tabular-nums;
}
.btn.speed .set { font-size: 12px; }
.btn.speed .got { font-size: 9px; color: var(--dim); }
.btn.speed .got:empty { display: none; }
.btn.rec[aria-pressed="true"] { color: var(--thr); border-color: var(--thr); }
.btn.rec[aria-pressed="true"] circle { fill: currentColor; }
.btn.rec:disabled { opacity: 0.35; cursor: not-allowed; }
.ui.folded .bar > :not(.fold) { display: none; }
.ui.folded .fold { opacity: 0.7; }

.panel {
  box-sizing: border-box; width: 400px; max-width: 100%;
  max-height: calc(100vh - var(--bar-h, 48px) - 110px); max-height: calc(100dvh - var(--bar-h, 48px) - 110px);
  overflow: auto; overscroll-behavior: contain;
  background: rgba(6, 9, 15, 0.88); border: 1px solid var(--line); border-radius: 3px;
}
.panel[hidden] { display: none; }
.phead {
  position: sticky; top: 0; z-index: 1; display: flex; align-items: center; justify-content: space-between;
  padding: 4px 4px 4px 12px; background: rgb(6, 9, 15); border-bottom: 1px solid var(--line);
}
.phead h2 { margin: 0; font-size: 11px; font-weight: 500; letter-spacing: 0.12em; text-transform: uppercase; }
.phead .x { width: 28px; height: 28px; padding: 0; display: grid; place-items: center; background: none; border: 1px solid transparent; border-radius: 3px; color: var(--dim); }
.phead .x:hover { border-color: var(--line); color: var(--ink); }
.pbody { padding: 2px 12px 10px; }
.pbody h3 { margin: 12px 0 2px; font-size: 10px; font-weight: 500; letter-spacing: 0.12em; text-transform: uppercase; color: var(--epi); opacity: 0.8; }
.row { padding: 5px 0 6px; border-top: 1px solid rgba(217, 221, 230, 0.07); }
.pbody h3 + .row, .pbody > .row:first-child { border-top: 0; }
.rmain { display: flex; align-items: center; gap: 8px; min-height: 26px; }
.rmain .lbl { color: var(--ink); }
.ui kbd {
  margin-left: auto; padding: 0 4px; font: 10px var(--mono); color: var(--dim);
  border: 1px solid var(--line); border-radius: 2px; white-space: nowrap;
}
.help { margin: 1px 0 0; color: var(--dim); font-size: 11px; line-height: 1.4; }
.row.t-toggle .help { padding-left: 36px; }
.note { margin: 10px 0 0; color: var(--dim); font-size: 11px; line-height: 1.4; }

.sw { display: flex; align-items: center; gap: 10px; padding: 0; background: none; border: 0; text-align: left; }
.track { position: relative; flex: none; width: 26px; height: 14px; box-sizing: border-box; border: 1px solid var(--line2); border-radius: 2px; }
.track::after { content: ""; position: absolute; top: 2px; left: 2px; width: 8px; height: 8px; background: var(--dim); }
.sw[aria-checked="true"] .track { border-color: var(--epi); }
.sw[aria-checked="true"] .track::after { left: 14px; background: var(--epi); }
.cyc { display: flex; align-items: center; gap: 10px; padding: 0; background: none; border: 0; text-align: left; }
.cyc .val, .knobs .val { color: var(--epi); font-variant-numeric: tabular-nums; }
.cyc .val { padding: 1px 6px; border: 1px solid var(--line); border-radius: 2px; }
.seg { display: inline-flex; flex-wrap: wrap; gap: 2px; }
.ui .seg button, .ui .kb, .ui .act {
  min-width: 30px; height: 24px; padding: 0 7px; background: none; border: 1px solid var(--line); border-radius: 2px;
}
.ui .seg button[aria-pressed="true"] { border-color: var(--epi); color: var(--epi); }
.knobs { display: inline-flex; align-items: center; gap: 6px; }
.knobs .val { min-width: 3.2em; text-align: center; }
.row.slider .rmain { gap: 10px; }
.row.slider .lbl { min-width: 6.5em; }
.row.slider .val { min-width: 7.5em; color: var(--epi); }
.ui input[type="range"] { flex: 1; min-width: 80px; height: 26px; margin: 0; background: transparent; -webkit-appearance: none; appearance: none; }
.ui input[type="range"]::-webkit-slider-runnable-track { height: 1px; background: var(--line2); }
.ui input[type="range"]::-moz-range-track { height: 1px; background: var(--line2); }
.ui input[type="range"]::-webkit-slider-thumb { -webkit-appearance: none; width: 9px; height: 16px; margin-top: -8px; background: var(--bg); border: 1px solid var(--epi); border-radius: 0; }
.ui input[type="range"]::-moz-range-thumb { width: 9px; height: 16px; box-sizing: border-box; background: var(--bg); border: 1px solid var(--epi); border-radius: 0; }
.ui input[type="range"]:disabled { opacity: 0.35; }

/* phones (narrow screens): tighter margins, a compact entropy panel (shorter lines from main.js), panels at most
   a little over half the screen, so the dish always shows */
@media (max-width: 559px) {
  #entropy { top: max(10px, env(safe-area-inset-top, 0px)); right: 10px; max-width: calc(100% - 20px); padding: 5px 7px; font-size: 10px; line-height: 1.45; }
  #overlay { top: max(10px, env(safe-area-inset-top, 0px)); left: 10px; max-width: calc(100% - 20px); max-height: 45vh; overflow: hidden; font-size: 9px; }
  body.entropy-on #overlay { top: 84px; }
  #rec { top: auto; bottom: calc(max(10px, env(safe-area-inset-bottom, 0px)) + var(--ui-h, 0px) + 30px); left: 10px; }
  #hint { left: 10px; right: 10px; bottom: calc(max(10px, env(safe-area-inset-bottom, 0px)) + var(--ui-h, 0px) + 8px); font-size: 11px; }
  .ui { left: max(10px, env(safe-area-inset-left, 0px)); bottom: max(10px, env(safe-area-inset-bottom, 0px)); max-width: calc(100% - 20px); }
  .panel { width: 100%; max-height: min(55vh, calc(100vh - var(--bar-h, 48px) - 110px)); max-height: min(55dvh, calc(100dvh - var(--bar-h, 48px) - 110px)); }
  .pbody { padding: 2px 10px 8px; }
}

/* a phone held sideways: the same compact entropy panel, out of the panels' way */
@media (max-height: 499px) {
  #entropy { top: max(8px, env(safe-area-inset-top, 0px)); right: max(10px, env(safe-area-inset-right, 0px)); padding: 5px 7px; font-size: 10px; line-height: 1.45; }
  .ui { bottom: max(8px, env(safe-area-inset-bottom, 0px)); }
  .panel { max-height: calc(100vh - var(--bar-h, 48px) - 40px); max-height: calc(100dvh - var(--bar-h, 48px) - 40px); }
}

/* fingers: bigger targets */
@media (pointer: coarse) {
  .ui { --s: 42px; }
  .ui svg { width: 22px; height: 22px; }
  .rmain { min-height: 36px; }
  .ui .seg button, .ui .kb, .ui .act { min-width: 40px; height: 34px; }
  .track { width: 34px; height: 20px; }
  .track::after { width: 12px; height: 12px; }
  .sw[aria-checked="true"] .track::after { left: 18px; }
  .row.t-toggle .help { padding-left: 44px; }
  .phead .x { width: 38px; height: 38px; }
  .ui input[type="range"] { height: 36px; }
  .ui input[type="range"]::-webkit-slider-thumb { width: 14px; height: 26px; margin-top: -13px; }
  .ui input[type="range"]::-moz-range-thumb { width: 14px; height: 26px; }
}

/* step C3b: recording, top left (outside the recorded dish: only the canvas is recorded) */
#rec {
  position: absolute; top: 14px; left: max(16px, env(safe-area-inset-left, 0px));
  display: flex; align-items: center; gap: 7px; padding: 3px 8px 3px 7px;
  background: var(--panel); border: 1px solid var(--thr); border-radius: 3px;
  color: var(--thr); font-size: 11px; letter-spacing: 0.08em; font-variant-numeric: tabular-nums; pointer-events: none;
}
#rec[hidden] { display: none; }
#rec .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--thr); }
body.recording #overlay { margin-top: 30px; }

/* app: the zoom buttons (right edge, middle) and the scale bar (bottom right, above the hint line) */
.zoombox {
  position: absolute; right: max(16px, env(safe-area-inset-right, 0px)); top: 50%; transform: translateY(-50%);
  display: flex; flex-direction: column; align-items: center; gap: 2px; --s: 30px;
  -webkit-user-select: none; user-select: none;
}
.zoombox button { font: inherit; color: var(--ink); touch-action: manipulation; cursor: pointer; }
.zoombox svg { width: 16px; height: 16px; fill: none; stroke: currentColor; stroke-width: 1.25; stroke-linecap: square; }
.zoombox button:disabled { opacity: 0.35; cursor: default; }
.zoombox .zval { min-height: 14px; font-size: 10px; color: var(--epi); font-variant-numeric: tabular-nums; }
.zoombox:not(.zoomed) { opacity: 0.7; }
.scalebar {
  position: absolute; right: max(16px, env(safe-area-inset-right, 0px)); bottom: calc(max(14px, env(safe-area-inset-bottom, 0px)) + 48px);
  display: flex; flex-direction: column; align-items: flex-end; gap: 3px; pointer-events: none;
  color: var(--ink); font-size: 10px; letter-spacing: 0.06em; font-variant-numeric: tabular-nums; opacity: 0.85;
  padding: 3px 6px 5px; background: var(--panel); border-radius: 3px;
}
.scalebar .sline { display: block; height: 2px; background: var(--ink); }
.scalebar[hidden] { display: none; }
/* step F0: the job legend (bottom right, above the scale bar; src/app.js) */
.joblegend {
  position: absolute; right: max(16px, env(safe-area-inset-right, 0px)); bottom: calc(max(14px, env(safe-area-inset-bottom, 0px)) + 88px);
  display: grid; gap: 1px; padding: 4px 7px 5px; background: rgba(6, 9, 15, 0.84); border-radius: 3px; pointer-events: auto;
  color: var(--ink); font-size: 10px; letter-spacing: 0.04em; font-variant-numeric: tabular-nums; opacity: 0.85;
}
.joblegend[hidden] { display: none; }
.joblegend .jrow { display: grid; grid-template-columns: 8px auto 3.2em; align-items: center; gap: 6px; cursor: default; }
.joblegend .jdot { width: 7px; height: 7px; border-radius: 50%; }
.joblegend .jn { text-align: right; color: var(--dim); }
/* step H1: under the harmonic look the bar sits on the black as a microscope's does (no panel behind it) */
.scalebar.scope { background: none; color: #e8e8e8; opacity: 1; letter-spacing: 0.02em; }
.scalebar.scope .sline { background: #e8e8e8; }
@media (pointer: coarse) { .zoombox { --s: 40px; } .zoombox svg { width: 20px; height: 20px; } }
@media (max-width: 559px) {
  /* a phone: a row just above the toolbar (hidden while a panel is open, which covers that place) */
  .zoombox { flex-direction: row; right: 10px; top: auto; transform: none; bottom: calc(max(10px, env(safe-area-inset-bottom, 0px)) + var(--bar-h, 48px) + 10px); }
  .zoombox .zval { min-width: 2.6em; text-align: center; }
  .scalebar { right: 10px; bottom: calc(max(10px, env(safe-area-inset-bottom, 0px)) + var(--bar-h, 48px) + 62px); }
  body.panel-open .zoombox, body.panel-open .scalebar, body.panel-open .joblegend { display: none; }
  .joblegend { right: 10px; bottom: calc(max(10px, env(safe-area-inset-bottom, 0px)) + var(--bar-h, 48px) + 100px); font-size: 9px; padding: 3px 6px 4px; }
  .joblegend .jn { display: none; }
  .joblegend .jrow { grid-template-columns: 7px auto; }
}
@media (max-height: 499px) { .joblegend { display: none; } }
@media (max-height: 499px) { .zoombox { top: 50%; bottom: auto; transform: translateY(-50%); right: max(10px, env(safe-area-inset-right, 0px)); } }

/* app: the zoos (src/zoo.js), in the panels' style */
.pbody .note.zfirst { margin-top: 8px; }
.ptable { display: grid; grid-template-columns: 3.4em repeat(3, 1fr); gap: 3px; margin: 4px 0 2px; }
.ptable .ph { font-size: 10px; color: var(--dim); letter-spacing: 0.06em; align-self: end; text-align: center; }
.ptable .prow { align-self: center; text-align: left; }
.ui .pcell {
  display: flex; flex-direction: column; align-items: center; gap: 1px; padding: 4px 2px 3px;
  background: rgba(217, 221, 230, 0.03); border: 1px solid var(--line); border-radius: 2px;
}
.ui .pcell:hover { border-color: var(--line2); }
.pcell b { font-size: 15px; font-weight: 600; line-height: 1.1; }
.pcell small { font-size: 9.5px; color: var(--dim); }
.ui .pcell.ptrace { grid-column: span 3; flex-direction: row; justify-content: center; gap: 10px; }
.zrow { display: flex; align-items: center; gap: 9px; padding: 6px 0; border-top: 1px solid rgba(217, 221, 230, 0.07); }
.pbody h3 + .zrow { border-top: 0; }
.zpic { flex: none; width: 54px; display: flex; justify-content: center; }
.zmain { flex: 1; min-width: 0; }
.zhead { display: flex; align-items: baseline; gap: 8px; flex-wrap: wrap; }
.zhead b { font-weight: 600; }
.zwhat { color: var(--ink); font-size: 11px; line-height: 1.35; }
.znums, .zamt { color: var(--dim); font-size: 11px; line-height: 1.4; }
.zamt { color: var(--epi); opacity: 0.85; font-variant-numeric: tabular-nums; }
.zcount { color: var(--epi); font-variant-numeric: tabular-nums; font-size: 11px; }
.zjob { color: var(--dim); font-size: 10px; margin-right: auto; padding-left: 4px; }   /* step F0: the middle cell's job */
.ui .act.zpip { flex: none; }
canvas.portrait { position: static; inset: auto; display: block; flex: none; width: 56px; height: 56px; background: #020306; border: 1px solid rgba(217, 221, 230, 0.08); border-radius: 2px; }
.zfounders { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 4px; }
.zstatus { margin-top: 4px; }
svg.mol { display: block; overflow: visible; }

/* app: the new culture dialog (src/culture.js) */
.dlg-wrap {
  position: absolute; inset: 0; z-index: 5; display: flex; align-items: center; justify-content: center;
  padding: 12px; box-sizing: border-box; background: rgba(2, 3, 6, 0.45);
}
.dlg {
  --line2: rgba(217, 221, 230, 0.36);
  box-sizing: border-box; width: 520px; max-width: 100%; max-height: 100%; overflow: auto; overscroll-behavior: contain;
  background: rgba(6, 9, 15, 0.94); border: 1px solid var(--line); border-radius: 3px;
}
.dlg button { font: inherit; color: var(--ink); cursor: pointer; touch-action: manipulation; }
.dlg .seg button, .dlg .act {
  min-width: 30px; height: 26px; padding: 0 8px; background: none; border: 1px solid var(--line); border-radius: 2px;
}
.dlg .seg button[aria-pressed="true"] { border-color: var(--epi); color: var(--epi); }
.dlg .act.go { border-color: var(--epi); color: var(--epi); }
.dlg .rmain { flex-wrap: wrap; padding: 3px 0; }
.dlg .rmain .lbl { min-width: 5.5em; }
.dlg input.num {
  width: 6em; height: 24px; box-sizing: border-box; padding: 0 6px; font: inherit; color: var(--ink);
  background: rgba(217, 221, 230, 0.04); border: 1px solid var(--line); border-radius: 2px;
}
.dlg input[type="checkbox"] { accent-color: var(--epi); margin: 0; }
.envs { display: flex; flex-direction: column; gap: 3px; }
.dlg .env {
  display: flex; flex-direction: column; align-items: flex-start; gap: 1px; padding: 5px 8px; text-align: left;
  background: rgba(217, 221, 230, 0.02); border: 1px solid var(--line); border-radius: 2px;
}
.dlg .env b { font-weight: 500; }
.dlg .env span { color: var(--dim); font-size: 11px; line-height: 1.35; }
.dlg .env[aria-pressed="true"] { border-color: var(--epi); }
.dlg .env[aria-pressed="true"] b { color: var(--epi); }
.dlg .link { overflow-wrap: anywhere; }
.dlg-btns { display: flex; gap: 6px; margin-top: 10px; flex-wrap: wrap; }
.dimlbl { color: var(--dim) !important; font-size: 11px; }
@media (pointer: coarse) {
  .dlg .seg button, .dlg .act { min-width: 40px; height: 36px; }
  .dlg input.num { height: 34px; }
}

/* plain message: no WebGPU, device lost, shader error */
#msg {
  position: absolute; inset: 0; z-index: 10; display: flex; align-items: center; justify-content: center;
  padding: 16px; box-sizing: border-box; background: var(--bg);
}
#msg[hidden] { display: none; }
#msg .box {
  max-width: 34rem; padding: 18px 20px; border: 1px solid var(--line); border-radius: 6px;
  background: var(--panel); font-size: 13px; line-height: 1.6; overflow-wrap: anywhere;
}
#msg h2 { margin: 0 0 8px; font-size: 15px; font-weight: 500; color: var(--epi); }
#msg.error h2 { color: var(--thr); }
#msg ul { margin: 6px 0 10px; padding-left: 18px; }
#msg a { color: var(--epi); }
#msg pre { white-space: pre-wrap; color: var(--dim); font-size: 11px; max-height: 40vh; overflow: auto; }
#msg button {
  font: 500 12px var(--mono); letter-spacing: 0.06em; text-transform: uppercase;
  color: var(--ink); background: var(--panel); border: 1px solid var(--line);
  border-radius: 3px; padding: 8px 12px; cursor: pointer;
}
</style>
</head>
<body>
<canvas id="gpu" aria-label="Dark viscous fluid background with slow ripples"></canvas>
<pre id="overlay" hidden></pre>
<pre id="entropy" hidden></pre>
<p id="hint"></p>
<div id="rec" hidden><span class="dot"></span><span>REC 0:00</span></div>
<div id="msg" hidden><div class="box" id="msgbox"></div></div>

<noscript>
  <div style="padding:24px">This page needs JavaScript and WebGPU. The older CPU version:
  <a href="reference/neon_organoid_cpu.html" style="color:#79dcd8">reference/neon_organoid_cpu.html</a></div>
</noscript>

<script>
// Safety net, in a classic script so it runs even when the module cannot load (e.g. opened as file://).
(function () {
  function show(html) {
    var m = document.getElementById('msg');
    if (!m.hidden) return;
    document.getElementById('msgbox').innerHTML = html;
    m.className = 'error'; m.hidden = false;
  }
  var how = '<p>Run a local server in the project folder:</p><pre>python -m http.server</pre>' +
    '<p>then open <a href="http://localhost:8000">http://localhost:8000</a> in Chrome or Edge.</p>' +
    '<p>The older CPU version works anywhere: <a href="reference/neon_organoid_cpu.html">reference/neon_organoid_cpu.html</a></p>';
  if (location.protocol === 'file:') {
    show('<h2>Opened as a file</h2><p>Browsers do not load the shaders and WebGPU from a file:// page.</p>' + how);
    return;
  }
  setTimeout(function () {
    if (!window.__moireBooted) show('<h2>The page did not start</h2><p>The JavaScript modules did not load or crashed early.</p>' + how);
  }, 8000);
})();
</script>
