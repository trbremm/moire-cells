<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Moiré Cells</title>
<link rel="icon" href="data:,">
<style>
:root {
  --bg: #04060a;
  --ink: #d9dde6;
  --dim: #7f8798;
  --line: rgba(217, 221, 230, 0.18);
  --panel: rgba(6, 9, 15, 0.62);
  --epi: #79dcd8;
  --thr: #ff7062;
  --mono: 'IBM Plex Mono', ui-monospace, 'Cascadia Mono', Consolas, monospace;
  color-scheme: dark;
  background: var(--bg);
}
html, body { height: 100%; margin: 0; }
body {
  position: relative; overflow: hidden;
  background: var(--bg); color: var(--ink);
  font-family: var(--mono); font-size: 12px; line-height: 1.5;
}
canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; cursor: crosshair; }

/* plain message: no WebGPU, device lost, shader error */
#msg {
  position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
  padding: 16px; box-sizing: border-box; background: var(--bg);
}
#msg[hidden] { display: none; }
#msg .box {
  max-width: 34rem; padding: 18px 20px; border: 1px solid var(--line); border-radius: 6px;
  background: var(--panel); font-size: 13px; line-height: 1.6; overflow-wrap: anywhere;
}
#msg h2 { margin: 0 0 8px; font-size: 15px; font-weight: 500; color: var(--epi); }
#msg.error h2 { color: var(--thr); }
#msg ul { margin: 6px 0 10px; padding-left: 18px; }
#msg a { color: var(--epi); }
#msg pre { white-space: pre-wrap; color: var(--dim); font-size: 11px; max-height: 40vh; overflow: auto; }
#msg button {
  font: 500 12px var(--mono); letter-spacing: 0.06em; text-transform: uppercase;
  color: var(--ink); background: var(--panel); border: 1px solid var(--line);
  border-radius: 3px; padding: 8px 12px; cursor: pointer;
}
</style>
</head>
<body>
<canvas id="gpu" aria-label="Dark background drawn with WebGPU"></canvas>
<div id="msg" hidden><div class="box" id="msgbox"></div></div>

<noscript>
  <div style="padding:24px">This page needs JavaScript and WebGPU. The older CPU version:
  <a href="reference/neon_organoid_cpu.html" style="color:#79dcd8">reference/neon_organoid_cpu.html</a></div>
</noscript>

<script>
// Safety net, in a classic script so it runs even when the module cannot load (e.g. opened as file://).
(function () {
  function show(html) {
    var m = document.getElementById('msg');
    if (!m.hidden) return;
    document.getElementById('msgbox').innerHTML = html;
    m.className = 'error'; m.hidden = false;
  }
  var how = '<p>Run a local server in the project folder:</p><pre>python -m http.server</pre>' +
    '<p>then open <a href="http://localhost:8000">http://localhost:8000</a> in Chrome or Edge.</p>' +
    '<p>The older CPU version works anywhere: <a href="reference/neon_organoid_cpu.html">reference/neon_organoid_cpu.html</a></p>';
  if (location.protocol === 'file:') {
    show('<h2>Opened as a file</h2><p>Browsers do not load the shaders and WebGPU from a file:// page.</p>' + how);
    return;
  }
  setTimeout(function () {
    if (!window.__moireBooted) show('<h2>The page did not start</h2><p>The JavaScript modules did not load or crashed early.</p>' + how);
  }, 8000);
})();
</script>
<script type="module" src="src/main.js"></script>
</body>
</html>
