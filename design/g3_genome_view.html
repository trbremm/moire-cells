<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Genome views</title>
<style>
:root { color-scheme: dark; }
body { margin: 0; padding: 16px; background: #000; color: #d9dde6; font: 13px system-ui, sans-serif; }
.row { display: flex; gap: 10px; flex-wrap: wrap; margin: 6px 0 14px; align-items: flex-start; }
canvas { width: 220px; height: 220px; background: #000; }
p { margin: 2px 0; opacity: 0.8; }
</style></head>
<body data-stage="running-10">
<p>Step G3, the genome view (src/folding.js drawGenome): random genomes, each under its HOME fold and its STRESS fold (the same lattices refolded); then a birth's small drift. ?seed= to draw others.</p>
<div id="out"></div>
<script type="module">
import { drawGenome, stampLattices, W_FS } from '../src/folding.js';
const q = new URLSearchParams(location.search);
let a = (Number(q.get('seed')) || 7) >>> 0;
const rng = () => { a = (a + 0x6d2b79f5) >>> 0; let t = a; t = Math.imul(t ^ (t >>> 15), t | 1); t ^= t + Math.imul(t ^ (t >>> 7), t | 61); return ((t ^ (t >>> 14)) >>> 0) / 4294967296; };
const out = document.getElementById('out'), S = 440;
for (let n = 0; n < 3; n++) {
  const g = new Float32Array(224);
  stampLattices(g, rng, 0);
  for (let r = 0; r < 8; r++) g[84 + r] = rng();          // an expression
  const row = document.createElement('div'); row.className = 'row';
  const views = [['home', (x) => { x[W_FS + 3] = 0; }], ['stress fold', (x) => { x[W_FS + 3] = 1; }],
    ['home, a birth later', (x) => { x[W_FS + 3] = 0; for (let r = 0; r < 8; r++) { x[188 + r] += 0.015 * (rng() - 0.5) * 3.4; x[196 + r] += 0.015 * (rng() - 0.5) * 3.4; x[204 + r] += 0.075 * (rng() - 0.5) * 3.4; } }]];
  for (const [name, f] of views) {
    const g2 = g.slice(); f(g2);
    const cv = document.createElement('canvas'); cv.width = cv.height = S; cv.title = name;
    drawGenome(cv.getContext('2d'), S, g2, 0);
    const box = document.createElement('div'); box.append(cv, Object.assign(document.createElement('p'), { textContent: `genome ${n + 1}: ${name}` }));
    row.append(box);
  }
  out.append(row);
}
</script></body></html>
